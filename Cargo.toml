[package]
name = "mempal"
version = "0.4.1"
edition = "2024"
license = "MIT"
description = "Project memory for coding agents. Single binary, hybrid search, knowledge graph."
repository = "https://github.com/RyderFreeman4Logos/mempal"
homepage = "https://github.com/RyderFreeman4Logos/mempal"
documentation = "https://github.com/RyderFreeman4Logos/mempal"
rust-version = "1.85"
readme = "README.md"
keywords = ["memory", "mcp", "sqlite", "agents", "search"]
categories = ["command-line-utilities", "development-tools"]
# Keep the published crate tarball focused on runtime + downstream-facing
# docs. Everything below is maintainer-only repo material that should never
# ship to crates.io. See release tag notes for rationale.
exclude = [
    ".claude/**",     # local Claude Code config + hooks (hard blocker if shipped)
    ".mcp.json",      # local MCP server registration for this repo
    "AGENTS.md",      # repo-only agent working rules
    "CLAUDE.md",      # repo-only agent working rules (same content as AGENTS.md)
    "hooks/**",       # legacy project-level hooks; not part of mempal runtime
    "specs/**",       # internal agent-spec Task Contracts (README links redirected to GitHub)
    "docs/plans/**",  # internal implementation plans (README links redirected to GitHub)
    "books/**",       # mdBook manuscript + 2.5MB local Mermaid asset; repo/docs only, not runtime
]

[[bin]]
name = "mempal"
path = "src/main.rs"

[features]
default = []
integration = []
model2vec = ["dep:model2vec-rs"]
onnx = ["dep:ort", "dep:tokenizers"]
rest = ["dep:axum", "dep:tower", "dep:tower-http"]
# Test-only seam: exposes `AsyncDb::with_read_delay` so the runtime-liveness /
# read-concurrency regression tests (#345) can inject cold-read latency without
# a multi-GB database. The default build does NOT carry this overhead.
db-test-seam = []

[dependencies]
anyhow = "1.0.103"
arc-swap = "1"
async-trait = "0.1"
axum = { version = "0.8", optional = true }
bimap = "0.6"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
daemonize = "0.5"
futures = "0.3"
jieba-rs = "0.8"
libc = "0.2"
model2vec-rs = { version = "0.1", optional = true }
notify = "8"
ort = { version = "2.0.0-rc.9", optional = true }
percent-encoding = "2"
quick-xml = "0.41"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "1.4.0", features = ["client", "server", "macros", "schemars", "transport-async-rw", "transport-io"] }
rusqlite = { version = "0.37", features = ["bundled", "functions", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlite-vec = "0.1.9"
tempfile = "3"
thiserror = "2"
tokenizers = { version = "0.22", optional = true }
tokio = { version = "1", features = ["full", "test-util"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }
zip = { version = "6", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "z"        # optimize for size (slightly slower than "3" but much smaller)
lto = true             # link-time optimization — biggest size reduction
codegen-units = 1      # single codegen unit — better optimization, slower compile
strip = true           # strip debug symbols from binary
panic = "abort"        # no unwinding — smaller binary, faster panic

[dev-dependencies]
dotenvy = "0.15"
filetime = "0.2"
axum = "0.8"
hyper = { version = "0.14", features = ["http1", "server", "tcp"] }
mockito = "1"
safetensors = "0.5"
serde_json = "1"
tempfile = "3"
