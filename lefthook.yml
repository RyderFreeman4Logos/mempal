# Lefthook — git hooks manager
# Install: just install-hooks  (or: lefthook install)
# Docs: https://github.com/evilmartians/lefthook

post-merge:
  commands:
    auto-install:
      run: scripts/hooks/post-merge.sh

pre-commit:
  commands:
    branch-protection:
      run: scripts/hooks/branch-protection.sh
    quick-format-check:
      run: just fmt-check
    quality-gates:
      files: git diff --cached --name-only --diff-filter=ACMR | grep -E '(^|/)(Cargo\.toml|Cargo\.lock)$|\.rs$' || true
      env:
        CARGO_BUILD_JOBS: "2"
      run: just quality-gates

pre-push:
  commands:
    branch-protection:
      run: scripts/hooks/branch-protection.sh
    local-gates:
      env:
        CARGO_BUILD_JOBS: "2"
      run: just local-gates
    review-check:
      run: scripts/hooks/review-check.sh
