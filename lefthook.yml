# Lefthook — git hooks manager
# Install: just install-hooks  (or: lefthook install)
# Docs: https://github.com/evilmartians/lefthook

post-merge:
  commands:
    auto-install:
      run: scripts/hooks/post-merge.sh

pre-commit:
  commands:
    branch-protection:
      run: scripts/hooks/branch-protection.sh
    quick-format-check:
      run: just fmt-check
    fast-gates:
      files: git diff --cached --name-only --diff-filter=ACMR | grep -E '(^|/)(Cargo\.toml|Cargo\.lock)$|\.rs$' || true
      env:
        CARGO_BUILD_JOBS: "2"
      run: just pre-commit-fast

pre-push:
  commands:
    branch-protection:
      run: scripts/hooks/branch-protection.sh
    changelog-check:
      run: |
        # Require CHANGELOG.md in the diff when source files change.
        # This is intentionally a simple presence check, not a content
        # validator — the PR review process verifies entry quality.
        base="$(git merge-base HEAD origin/main)"
        changed_files="$(git diff --name-only "${base}..HEAD")"

        if echo "$changed_files" | grep -qE '^src/.*\.rs$'; then
          if echo "$changed_files" | grep -q '^CHANGELOG.md$'; then
            echo "✔️ CHANGELOG.md updated"
          else
            echo "❌ Source files changed but CHANGELOG.md not updated."
            echo "   Add an entry under [Unreleased] in CHANGELOG.md."
            exit 1
          fi
        fi
    local-gate-receipt:
      run: bash scripts/gates/local-gate-receipt.sh validate
    review-check:
      run: scripts/hooks/review-check.sh
